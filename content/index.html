---
layout: default
image: /img/faceslitscan-blur.jpg
eleventyNavigation:
  title: "Work"
  order: 1
---
<div class="description">
	<h2>
		{{ site.description }}
	</h2>
</div>

<div class="projects">
	{% for project in collections.projects %}
	<div class="project {{project.data.title | slugify}}">
		<a href="{{ project.url }}">
			<!-- {% include "image.html" src: project.data.image overlay: project.data.color %} -->
			{% image project.data.image "" "100vw" project.data.color %}
			<h2>{{ project.data.title }}</h2>
		</a>
	</div>
	{% endfor %}
</div>
